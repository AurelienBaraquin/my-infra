    # ============================================================
    # BLOC 6 : Vikunja (vikunja.aurelienb.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name vikunja.aurelienb.com;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Rate Limiting
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        location / {
            proxy_pass http://vikunja:3456;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # BLOC 7 : Chinese Notebook (chinesenote.aurelienb.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name chinesenote.aurelienb.com;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate Limiting
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        location / {
            proxy_pass http://chinese_notebook:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
