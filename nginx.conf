events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;

    # ============================================================
    # RATE LIMITING
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # ============================================================
    # SSL GLOBAL SETTINGS
    # ============================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ============================================================
    # DEFAULT SERVER — rejette les requêtes avec Host inconnu
    # ============================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        return 444;
    }

    # ============================================================
    # HTTP → HTTPS redirect (tous les vhosts)
    # ============================================================
    server {
        listen 80;
        server_name aurelienb.com www.aurelienb.com
                    portainer.aurelienb.com
                    vikunja.aurelienb.com
                    chinesenote.aurelienb.com;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # BLOC 1 : Site principal (aurelienb.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name aurelienb.com www.aurelienb.com;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Rate Limiting
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        # 1. Portfolio
        location / {
            proxy_pass http://portfolio:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Pixel Quest
        location /pixel-quest {
            proxy_pass http://pixelquest:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # BLOC 2 : Portainer (portainer.aurelienb.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name portainer.aurelienb.com;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate Limiting (plus strict pour admin panel)
        limit_req zone=general burst=10 nodelay;
        limit_conn addr 5;

        location / {
            proxy_pass http://portainer:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # BLOC 3 : Easter Egg (onlyfans.aurelienb.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name onlyfans.aurelienb.com;

        ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

        return 301 https://aurelienb.com$request_uri;
    }

