# Redirections sans backend (service noop@internal).
http:
  middlewares:
    www-to-apex:
      redirectRegex:
        regex: '^https://www\.(.+)'
        replacement: 'https://${1}'
        permanent: true
    to-apex:
      redirectRegex:
        regex: '^https://[^/]+(.*)'
        replacement: 'https://{{ env "DOMAIN" }}${1}'
        permanent: true

  routers:
    # Easter egg historique.
    onlyfans:
      rule: 'Host(`onlyfans.{{ env "DOMAIN" }}`)'
      middlewares: [to-apex]
      service: noop@internal
