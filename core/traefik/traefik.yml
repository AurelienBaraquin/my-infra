# Configuration statique Traefik v3 (relue uniquement au démarrage du conteneur).
# Le routage lui-même vient des labels Docker et de ./dynamic/*.yml (rechargés à chaud).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      names:
        CF-Connecting-IP: keep
        User-Agent: keep
  filters:
    # Garde les logs utiles sans noyer le disque : erreurs + requêtes lentes.
    statusCodes: ["400-599"]
    minDuration: 2s

api:
  dashboard: true

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    # Seul Cloudflare est autorisé à nous parler : on fait confiance à ses en-têtes X-Forwarded-*
    # (vraie IP client pour Authelia / rate-limit / logs) et on rejette tout accès direct à l'IP.
    # Plages : https://www.cloudflare.com/ips/ — à resynchroniser avec scripts/cloudflare-ips.sh.
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
    http:
      # Appliqués à TOUTES les routes HTTPS, avant celles définies par chaque service.
      middlewares:
        - cloudflare-only@file
        - rate-limit@file
        - security-headers@file
      tls: {}

providers:
  docker:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false  # un conteneur n'est exposé que s'il a `traefik.enable=true`
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

serversTransport:
  forwardingTimeouts:
    dialTimeout: 10s
