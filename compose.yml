# my-infra — point d'entrée unique.
#   docker compose up -d            → démarre tout
#   docker compose --profile archived up -d  → inclut aussi les projets archivés
#
# Chaque stack vit dans son dossier avec son propre compose.yml ; ce fichier ne fait que les
# assembler (Compose `include`, chemins relatifs résolus depuis chaque sous-dossier).
name: my-infra

include:
  - core/compose.yml   # Traefik (edge), socket-proxy, Authelia (SSO)
  - apps/compose.yml   # Sites publics : portfolio, pixel-quest, chinese notebook, démos
  - tools/compose.yml  # Outils perso / admin : Portainer

# Réseaux : `proxy` est le seul réseau partagé entre Traefik et les services exposés (déclaré
# dans chaque stack sous le même nom Docker). Tout le reste — bases de données, workers… — reste
# sur le réseau `default` privé de sa stack, injoignable depuis Traefik et depuis Internet.

