services:
  # Proxy
  reverse-proxy:
    image: nginx:alpine
    container_name: web-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
      - pixelquest
      - manifeste
      - miku
    logging: &logging-config
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Portfolio
  portfolio:
    build: ./portfolio
    container_name: app-portfolio
    restart: always
    logging: *logging-config

  # PixelQuest
  pixelquest:
    build: ./pixel_quest
    container_name: app-pixelquest
    restart: always
    env_file:
      - ./secrets/pixel_quest.env
    logging: *logging-config

  # Manifeste Navigator
  manifeste:
    build: ./manifeste
    container_name: app-manifeste
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    logging: *logging-config

  miku:
    build: ./miku
    container_name: app-miku
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    logging: *logging-config

  # Portainer
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
