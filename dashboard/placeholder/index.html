<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #9a9a94; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { padding: 0 16px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Dashboard</h1>
    <p>Connecté. Le tableau de bord arrive bientôt.</p>
  </main>
</body>
</html>
